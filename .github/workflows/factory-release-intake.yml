name: Track staging work in Factory

on:
  # Staging has no deployment workflow to follow here, so each push to staging reports at once (WORK-17632).
  push:
    branches: [staging]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write

concurrency:
  group: factory-staging-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: dm-gcp-public-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile staging PRs and deployment receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_INTAKE_MODE: observe
          FACTORY_DEPLOYMENT_WORKFLOW: ''
        run: node .github/scripts/factory-release-intake.mjs
