name: Publish CLI to npm
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-npm-release
  cancel-in-progress: false
jobs:
  publish:
    name: Publish production CLI packages
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/dealmachine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify trusted publishing tooling
        run: node --input-type=module -e "import { execFileSync } from 'node:child_process'; import assert from 'node:assert/strict'; const v = execFileSync('npm', ['--version'], { encoding:'utf8' }).trim().split('.').map(Number); assert(v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1))), 'npm 11.5.1 or later is required for trusted publishing');"
      - run: npm ci
      - name: Build, publish and verify implementation and alias
        id: release
        run: npm run release:auto:publish
      - name: Retain release evidence and exact package archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 90
